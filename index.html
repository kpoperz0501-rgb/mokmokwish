<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Birthday Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone-container">
      <div class="card" tabindex="0">
        <div class="outside">
          <div class="front">
            <p>Happy Birthday</p>
            <div class="cake">
              <div class="top-layer"></div>
              <div class="middle-layer"></div>
              <div class="bottom-layer"></div>
              <div class="candle"></div>
            </div>
          </div>
          <div class="back"></div>
        </div>
        <div class="inside">
          <p>Happy 27th Birthday My Love!</p>
          <p>I'm so proud to know you, my love. I hope you have a great day and year ahead, filled with love, laughter, and all the things that make you happy. You deserve it all. Keep shining bright, my love.</p>
          <h1>&#127873;</h1>
        </div>
      </div>
    </div>
  </body>
</html>
